name: Publish to PyPI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build hatchling

      - name: Extract version
        id: meta
        run: |
          VERSION=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if version already published
        id: check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://pypi.org/pypi/langchain-ckg/${{ steps.meta.outputs.version }}/json)
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Build and publish
        if: steps.check.outputs.status == '404'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install twine
          python -m build
          twine upload dist/*
