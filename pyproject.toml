[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-ckg"
version = "0.3.1"
description = "LangChain retriever backed by Compact Knowledge Graphs (CKG) — deterministic, SHA-256 anchored, MCP-native"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Daniel Yarmoluk", email = "daniel.yarmoluk@gmail.com" }]
keywords = ["langchain", "rag", "knowledge-graph", "ckg", "mcp", "retriever"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain-core>=0.2.0",
    "ckg-mcp>=0.7.0",
]

[project.optional-dependencies]
x402 = ["x402[evm]>=0.5.0", "eth-account>=0.11.0", "httpx>=0.27.0"]

[project.urls]
Homepage = "https://graphifymd.com"
Repository = "https://github.com/Yarmoluk/langchain-ckg"
"Bug Tracker" = "https://github.com/Yarmoluk/langchain-ckg/issues"
